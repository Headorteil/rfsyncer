[project]
name = "rfsyncer"
version = "0.0.14"
description = "A symple tool to make diffs and synchronize file trees."
readme = "README.md"
authors = [
    { name = "Headorteil" }
]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "jinja2>=3.1.6",
    "paramiko>=5.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "typer>=0.27.3",
]

[project.scripts]
rfsyncer = "rfsyncer.cli:app"

[project.urls]
Repository = "https://github.com/Headorteil/rfsyncer"

[build-system]
requires = ["uv_build>=0.7.18,<0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # Conflicts
  "ISC001",  # Conflicts

  "D",       # Docstrings

  "FBT001",  # Boolean arg
  "FBT002",  # Boolean arg
  "FBT003",  # Boolean arg
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many args
  "PLR0915", # Too many statements
  "PLR0917", # Too many args
  "PLR2004", # Magic values
  "C901",    # Too many branches
  "S108",    # Usage of tempfiles
  "CPY001",  # Copyright
]
